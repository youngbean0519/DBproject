<!DOCTYPE html>
<html lang="ko">
    <head>

        <title>Login | KinoLetter</title>

    </head>
    <body>

                계정이 없으신가요? <a href="register.html">회원가입</a>
            </p>
        </form>
        <script type="module" src="js/navbar.js"></script>
        <script type="module" src="js/auth.js"></script>
    </body>
</html>
