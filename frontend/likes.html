<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>좋아요</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <h2>내 좋아요</h2><ul id="list"></ul>

        <script type="module" src="js/navbar.js"></script>
        <script type="module">
            import { apiFetch } from "./js/utils.js";
            const $ = s => document.querySelector(s);

            async function load() {
                const data = await apiFetch("/likes");           // GET
                $("#list").innerHTML = data.map(l => `
                    <li>${l.target_value} (${l.target_type})
                    <button data-type="${l.target_type}" data-val="${l.target_value}">취소</button></li>`
                ).join("");
            }
            document.body.addEventListener("click", async e => {
                if(e.target.tagName!=="BUTTON") return;
                await apiFetch("/likes", {
                    method: "DELETE",
                    body: JSON.stringify({
                        target_type: e.target.dataset.type,
                        target_value: e.target.dataset.val
                    })
                });
                load();
            });
            load();
        </script>
    </body>
</html>
