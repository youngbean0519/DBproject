<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>Admin</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <h2>공지 메일 발송</h2>
        <textarea id="msg" rows="6" style="width:100%"></textarea><br>
        <button id="sendBtn">Send</button>
        <div class="msg"></div>

        <script type="module" src="js/navbar.js"></script>
        <script type="module">
            import { apiFetch, showMessage } from "./js/utils.js";
            const $ = s => document.querySelector(s);
            $("#sendBtn").onclick = async () => {
                try {
                await apiFetch("/admin/send-notification", {
                    method:"POST",
                    body: JSON.stringify({ message: $("#msg").value })
                });
                showMessage($(".msg"), "보냈습니다!");
                } catch (e) {
                showMessage($(".msg"), e.message, true);
                }
            };
        </script>
    </body>
</html>
