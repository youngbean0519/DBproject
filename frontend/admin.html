<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>관리자 | KinoLetter</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 32px 24px;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1em 2em;
            background: #222;
        }
        .nav-links {
            display: flex;
            gap: 2em;
        }
        .nav-links a, .nav-links button {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1em;
            padding: 0.5em 1em;
        }
        .nav-links a.active, .nav-links button.active {
            border-bottom: 2px solid #fff;
        }
        .logout-btn {
            color: #fff;
            background: #e74c3c;
            border: none;
            border-radius: 4px;
            padding: 0.5em 1.2em;
            margin-left: 1.5em;
            font-size: 1.05em;
            cursor: pointer;
            transition: background 0.2s;
        }
        .logout-btn:hover {
            background: #c0392b;
        }
        .admin-section {
            margin: 2em 0;
            padding: 2em;
            background: #f7f7f7;
            border-radius: 8px;
            text-align: center;
        }
        #send-notifications-btn {
            font-size: 1.2em;
            padding: 1em 2em;
            background: #222;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 1em;
        }
        #send-notifications-btn:hover {
            background: #444;
        }
        #admin-msg {
            margin-top: 1.5em;
            font-size: 1.1em;
            color: #2d7a2d;
        }
        @media (max-width: 800px) {
            .container { max-width: 98vw; padding: 1em 0.5em; }
            .nav-links { gap: 1em; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">KinoLetter</div>
        <div class="nav-links" id="nav-links">
            <a href="movies.html" id="nav-movies">영화</a>
            <a href="watchlist.html" id="nav-watchlist">찜 목록</a>
            <a href="likes.html" id="nav-likes">좋아요</a>
            <a href="recommend.html" id="nav-recommend">추천 영화</a>
            <a href="admin.html" id="nav-admin" class="active">관리자</a>
            <button id="logoutBtn" class="logout-btn">로그아웃</button>
        </div>
    </nav>
    <div class="container">
        <h1>관리자 알림 발송</h1>
        <div class="admin-section">
            <p>버튼을 누르면 전체 회원에게 주간 추천 메일이 발송됩니다.</p>
            <button id="send-notifications-btn">회원 전체 메일 발송</button>
            <div id="admin-msg"></div>
        </div>
    </div>
    <script type="module">
    import { api } from './js/utils.js';
    document.getElementById('logoutBtn').onclick = function() {
        localStorage.removeItem('token');
        window.location.href = 'login.html';
    };
    document.getElementById('send-notifications-btn').onclick = async function() {
        const msgDiv = document.getElementById('admin-msg');
        msgDiv.textContent = '메일 발송 중...';
        try {
            const res = await api.post('/admin/send-notifications');
            msgDiv.textContent = res.message || '알림 전송 완료';
        } catch (e) {
            msgDiv.textContent = e.message || '메일 발송 실패';
            msgDiv.style.color = '#c0392b';
        }
    };
    </script>
</body>
</html>
