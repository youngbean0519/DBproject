<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>관리자 | KinoLetter</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div class="container">
            <h1>영화 관리</h1>
            
            <div class="admin-section">
                <h2>새 영화 추가</h2>
                <form id="add-movie-form">
                    <div class="form-group">
                        <label for="title">제목</label>
                        <input type="text" id="title" name="title" required>
                    </div>
                    <div class="form-group">
                        <label for="release_year">개봉년도</label>
                        <input type="number" id="release_year" name="release_year" required>
                    </div>
                    <div class="form-group">
                        <label for="genres">장르 (쉼표로 구분)</label>
                        <input type="text" id="genres" name="genres" required>
                    </div>
                    <div class="form-group">
                        <label for="poster_url">포스터 URL</label>
                        <input type="url" id="poster_url" name="poster_url" required>
                    </div>
                    <div class="form-group">
                        <label for="description">설명</label>
                        <textarea id="description" name="description" required></textarea>
                    </div>
                    <button type="submit">영화 추가</button>
                </form>
            </div>

            <div class="admin-section">
                <h2>영화 목록</h2>
                <div id="admin-movies-container" class="admin-movies-grid"></div>
            </div>
            
            <div class="msg error"></div>
        </div>
        <script type="module" src="js/navbar.js"></script>
        <script type="module" src="js/admin.js"></script>
    </body>
</html>
