<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>영화 - MovieDB</title>
        <link rel="stylesheet" href="css/style.css">
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    </head>
    <body>
        <nav class="navbar">
            <div class="nav-brand">MovieDB</div>
            <div class="nav-links">
                <a href="movies.html" class="active">영화</a>
                <a href="watchlist.html">시청목록</a>
                <a href="likes.html">좋아요</a>
                <button id="logoutBtn" class="btn-logout">로그아웃</button>
            </div>
        </nav>

        <div class="container">
            <div class="movie-tabs">
                <button class="tab-btn active" data-tab="search">영화 검색</button>
                <button class="tab-btn" data-tab="nowShowing">현재 상영</button>
                <button class="tab-btn" data-tab="upcoming">개봉 예정</button>
            </div>

            <div class="tab-content">
                <!-- 검색 탭 -->
                <div class="tab-pane active" id="search-tab">
                    <div class="search-section">
                        <input type="text" id="searchInput" placeholder="영화 제목을 입력하세요...">
                        <button id="searchBtn">검색</button>
                    </div>
                    <div id="searchResults" class="movie-grid"></div>
                </div>

                <!-- 현재 상영 탭 -->
                <div class="tab-pane" id="nowShowing-tab">
                    <div id="nowShowing" class="movie-grid"></div>
                </div>

                <!-- 개봉 예정 탭 -->
                <div class="tab-pane" id="upcoming-tab">
                    <div id="upcoming" class="movie-grid"></div>
                </div>
            </div>
        </div>

        <script type="module" src="js/movies.js"></script>
    </body>
</html>
